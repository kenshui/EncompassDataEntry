[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "encompass-ai-agent"
version = "0.1.0"
description = "Deployable AI agent for Encompass loan document extraction and field updates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
encompass-ai-agent = "encompass_ai_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
